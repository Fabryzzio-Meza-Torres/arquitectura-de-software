<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 707.356 440" width="707.356" height="440" style="--bg:#ffffff;--fg:#233247;--line:#73849b;--accent:#187f78;--muted:#334155;--surface:#eef3fb;--border:#71829a;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Arial:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Arial', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="Cliente" x1="70" y1="70" x2="70" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="API" x1="210" y1="70" x2="210" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Otros8" x1="350" y1="70" x2="350" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Servicio2" x1="490" y1="70" x2="490" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Servicio10" x1="630" y1="70" x2="630" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<rect class="activation" data-actor="API" x="205" y="90" width="10" height="280" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<g class="message" data-from="Cliente" data-to="API" data-label="t=0.0 ms - Solicitar datos de 10 servicios" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70" y1="90" x2="210" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="140" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">t=0.0 ms - Solicitar datos de 10 servicios</text>
</g>
<g class="message" data-from="API" data-to="Otros8" data-label="t=0.2 ms - 8 consultas en paralelo" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="130" x2="350" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="280" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">t=0.2 ms - 8 consultas en paralelo</text>
</g>
<g class="message" data-from="API" data-to="Servicio2" data-label="t=0.2 ms - Consulta original S2 lenta" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="170" x2="490" y2="170" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="350" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">t=0.2 ms - Consulta original S2 lenta</text>
</g>
<g class="message" data-from="API" data-to="Servicio10" data-label="t=0.5 ms - Consulta original S10 lenta" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="210" x2="630" y2="210" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="420" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">t=0.5 ms - Consulta original S10 lenta</text>
</g>
<g class="message" data-from="Otros8" data-to="API" data-label="t=15.3 ms - Finaliza el grupo de otros 8" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="350" y1="250" x2="210" y2="250" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="280" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">t=15.3 ms - Finaliza el grupo de otros 8</text>
</g>
<g class="message" data-from="Servicio2" data-to="API" data-label="t=1178.0 ms - Respuesta S2, intento 1" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="490" y1="290" x2="210" y2="290" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="350" y="280" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">t=1178.0 ms - Respuesta S2, intento 1</text>
</g>
<g class="message" data-from="Servicio10" data-to="API" data-label="t=1404.2 ms - Respuesta S10, intento 1" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="630" y1="330" x2="210" y2="330" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="420" y="320" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">t=1404.2 ms - Respuesta S10, intento 1</text>
</g>
<g class="message" data-from="API" data-to="Cliente" data-label="t=1404.2 ms - Respuesta final: ok" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="370" x2="70" y2="370" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="140" y="360" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">t=1404.2 ms - Respuesta final: ok</text>
</g>
<g class="actor" data-id="Cliente" data-label="Cliente" data-type="participant">
  <rect x="30" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="70" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Cliente</text>
</g>
<g class="actor" data-id="API" data-label="API" data-type="participant">
  <rect x="170" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="210" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">API</text>
</g>
<g class="actor" data-id="Otros8" data-label="Otros8" data-type="participant">
  <rect x="310" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="350" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Otros8</text>
</g>
<g class="actor" data-id="Servicio2" data-label="Servicio2" data-type="participant">
  <rect x="444.126" y="30" width="91.748" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="490" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Servicio2</text>
</g>
<g class="actor" data-id="Servicio10" data-label="Servicio10" data-type="participant">
  <rect x="582.644" y="30" width="94.712" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="630" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Servicio10</text>
</g>
</svg>