  <text x="210" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">API</text>
</g>
<g class="actor" data-id="Otros8" data-label="Otros 8 servicios" data-type="participant">
  <rect x="290" y="30" width="134.726" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="357.363" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Otros 8 servicios</text>
</g>
<g class="actor" data-id="Problema" data-label="Servicio problematico" data-type="participant">
  <rect x="464.726" y="30" width="162.143" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="545.7975" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Servicio problematico</text>
</g>
</svg>