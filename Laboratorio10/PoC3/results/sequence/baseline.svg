  <line x1="545.7975" y1="250" x2="210" y2="250" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="377.89875" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">t=1177.5 ms - Respuesta valida S2, intento 1</text>
</g>
<g class="message" data-from="Problema" data-to="API" data-label="t=1403.7 ms - Respuesta valida S10, intento 1" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="545.7975" y1="290" x2="210" y2="290" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="377.89875" y="280" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">t=1403.7 ms - Respuesta valida S10, intento 1</text>
</g>
<g class="message" data-from="API" data-to="Cliente" data-label="t=1403.7 ms - Respuesta final: ok" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="330" x2="70" y2="330" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="140" y="320" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">t=1403.7 ms - Respuesta final: ok</text>
</g>
<g class="actor" data-id="Cliente" data-label="Cliente" data-type="participant">
  <rect x="30" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="70" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Cliente</text>
</g>
<g class="actor" data-id="API" data-label="API" data-type="participant">
