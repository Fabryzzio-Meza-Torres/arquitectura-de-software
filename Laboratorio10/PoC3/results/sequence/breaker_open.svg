</g>
<g class="message" data-from="API" data-to="Cliente" data-label="t=17.5 ms - Respuesta final: degraded" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="370" x2="70" y2="370" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="140" y="360" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">t=17.5 ms - Respuesta final: degraded</text>
</g>
