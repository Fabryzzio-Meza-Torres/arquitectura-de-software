  <line x1="1030.7024999999999" y1="250" x2="210" y2="250" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="620.3512499999999" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">t=1.1 ms - 2 respuestas con cache vigente</text>
</g>
<g class="message" data-from="API" data-to="Otros8" data-label="t=1.4 ms - 8 consultas en paralelo" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="290" x2="520.9739999999999" y2="290" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="365.48699999999997" y="280" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">t=1.4 ms - 8 consultas en paralelo</text>
</g>
