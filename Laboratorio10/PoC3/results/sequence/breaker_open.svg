  <line x1="351.8055" y1="210" x2="210" y2="210" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="280.90274999999997" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">t=1.1 ms - Abierto: evita 2 consultas</text>
</g>
