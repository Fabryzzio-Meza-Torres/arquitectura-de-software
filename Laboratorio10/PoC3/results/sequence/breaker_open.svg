<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1135.1049999999998 440" width="1135.1049999999998" height="440" style="--bg:#ffffff;--fg:#233247;--line:#73849b;--accent:#187f78;--muted:#334155;--surface:#eef3fb;--border:#71829a;background:var(--bg)"><rect width="100%" height="100%" fill="#ffffff"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Arial:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Arial', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="Cliente" x1="70" y1="70" x2="70" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="API" x1="210" y1="70" x2="210" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Circuito" x1="351.8055" y1="70" x2="351.8055" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Otros8" x1="520.9739999999999" y1="70" x2="520.9739999999999" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Problema" x1="709.4085" y1="70" x2="709.4085" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Replicas" x1="873.39" y1="70" x2="873.39" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Cache" x1="1030.7024999999999" y1="70" x2="1030.7024999999999" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<rect class="activation" data-actor="API" x="205" y="90" width="10" height="280" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<g class="message" data-from="Cliente" data-to="API" data-label="t=0.0 ms - Solicitar datos de 10 servicios" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70" y1="90" x2="210" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="140" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">t=0.0 ms - Solicitar datos de 10 servicios</text>
</g>
<g class="message" data-from="API" data-to="Circuito" data-label="t=0.8 ms - Consultar circuit breaker" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="130" x2="351.8055" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="280.90274999999997" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">t=0.8 ms - Consultar circuit breaker</text>
</g>
<g class="message" data-from="API" data-to="Cache" data-label="t=0.8 ms - Consultar datos dentro del TTL" data-line-style="solid" data-arrow-head="filled" data-self="false">
