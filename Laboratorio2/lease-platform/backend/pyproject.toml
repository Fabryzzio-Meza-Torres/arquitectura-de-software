[project]
name = "lease-poc-backend"
version = "0.1.0"
description = "Lea$e Phase 1 proof of concept API"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "python-multipart>=0.0.20",
  "sqlmodel>=0.0.24",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-cov>=6.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

